<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo do núcleo de esquemas</title>
  <link rel="stylesheet" href="../../css/base.css">
</head>
<body>
  <main class="principal" style="padding:16px;max-width:640px">
    <h1>Demo: núcleo de esquemas</h1>
    <p>Arrasta o ponto P, usa as setas (Shift = passo fino) e o slider a de y = a·x².</p>
    <div id="esquema"></div>
    <div id="controlos"></div>
    <div id="valores"></div>
    <h2>Figura explodida</h2>
    <div id="figura"></div>
  </main>
  <script src="../../js/nucleo.js"></script>
  <script src="referencial.js"></script>
  <script src="ponto.js"></script>
  <script src="controlos.js"></script>
  <script src="desenho.js"></script>
  <script src="proj3d.js"></script>
  <script src="figura.js"></script>
  <script>
    const N = Manual.nucleo;
    const ref = N.criarReferencial(document.getElementById('esquema'), { caixa: { xmin: -6, xmax: 6, ymin: -4, ymax: 8 } });
    const painel = N.painelValores(document.getElementById('valores'));
    const curva = ref.camada('curva');
    let a = 1;
    let p;
    function atualizarPainel() {
      painel.definir([['x', String(p.x())], ['y', String(p.y())], ['a·x²', String(a * p.x() * p.x())]]);
    }
    function desenhar() {
      N.limpar(curva);
      N.desenharFuncao(ref, curva, (x) => a * x * x, { cor: 'var(--cor-1)' });
    }
    p = N.pontoArrastavel(ref, { x: 2, y: 3, cor: 'var(--cor-2)', rotulo: 'P', aoMover: atualizarPainel });
    N.slider(document.getElementById('controlos'), {
      rotulo: 'a', min: -2, max: 2, passo: 0.1, valor: 1,
      aoMudar: (v) => { a = v; desenhar(); atualizarPainel(); },
    });
    desenhar();
    atualizarPainel();
    const circ = (cx, cy, r) => (g, cs) => g.appendChild(cs('circle', { cx, cy, r }));
    Manual.figura.criarEsquema({
      titulo: 'Átomo (demo)', largura: 240, altura: 160,
      partes: [
        { id: 'nuvem', rotulo: 'Nuvem eletrónica', descricao: 'Zona onde é provável encontrar os eletrões.', explodir: { dx: 0, dy: 10 }, desenhar: circ(120, 80, 70) },
        { id: 'nucleo', rotulo: 'Núcleo', descricao: 'Contém protões e neutrões.', explodir: { dx: 0, dy: -50 }, desenhar: circ(120, 80, 20) },
        { id: 'eletrao', rotulo: 'Eletrão', descricao: 'Carga negativa.', explodir: { dx: 40, dy: 40 }, desenhar: circ(190, 80, 6) },
        { id: 'orbita', rotulo: 'Órbita', descricao: 'Trajetória indicativa (parte escrita em SVG).', explodir: { dx: -40, dy: 40 },
          svg: '<ellipse cx="120" cy="80" rx="100" ry="30" fill="none" stroke-dasharray="4 3"/>' },
      ],
    }).montar(document.getElementById('figura'), {});
  </script>
</body>
</html>
