<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <script>
    try {
      var t = localStorage.getItem('manual10.tema');
      if (t === 'claro') document.documentElement.dataset.theme = 'light';
      else if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
  <title>Manual 10.º Ano</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="topo">
    <button type="button" id="botao-menu" class="botao-icone" aria-label="Abrir menu" aria-controls="lateral" aria-expanded="false">☰</button>
    <a class="marca" href="#/"><span class="marca-simbolo" aria-hidden="true">10º</span><span class="marca-nome">Manual 10.º Ano</span></a>
    <form id="form-pesquisa" class="pesquisa" role="search">
      <input id="campo-pesquisa" type="search" placeholder="Pesquisar…" aria-label="Pesquisar" autocomplete="off">
    </form>
    <div id="zona-conta" class="zona-conta"></div>
    <button type="button" id="botao-tema" class="botao"></button>
  </header>
  <div class="corpo">
    <nav id="lateral" class="lateral" aria-label="Disciplinas"></nav>
    <div id="cortina" class="cortina"></div>
    <main id="principal" class="principal" tabindex="-1"></main>
  </div>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/nucleo.js"></script>
  <script src="js/aleatorio.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/router.js"></script>
  <script src="js/texto.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/progresso.js"></script>
  <script src="js/pesquisa.js"></script>
  <script src="js/render.js"></script>
  <script src="js/tema.js"></script>
  <script src="esquemas/nucleo/referencial.js"></script>
  <script src="esquemas/nucleo/ponto.js"></script>
  <script src="esquemas/nucleo/controlos.js"></script>
  <script src="esquemas/nucleo/desenho.js"></script>
  <script src="esquemas/nucleo/proj3d.js"></script>
  <script src="esquemas/mat-a/calculo-cidadania.js"></script>
  <script src="esquemas/mat-a/calculo-estatistica.js"></script>
  <script src="esquemas/mat-a/calculo-geometria.js"></script>
  <script src="esquemas/mat-a/calculo-funcoes.js"></script>
  <script src="esquemas/mat-a/formatar.js"></script>
  <script src="conteudos/indice.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fila.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/vistas-conta.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
